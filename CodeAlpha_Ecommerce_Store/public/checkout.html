<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
  <header class="site-header">
    <div class="container nav-inner">
      <a class="logo" href="/index.html">CodeAlpha Store</a>
      <nav class="nav-links">
        <a href="/index.html">Shop</a>
        <a href="/cart.html">Cart<span class="cart-badge" id="cart-count"></span></a>
        <span id="nav-auth-area"></span>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Checkout</h1>

    <div id="checkout-summary"
      style="max-width:480px; background:#fff; border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:24px;">
      Loading...
    </div>

    <div id="checkout-form-wrap" class="form-card" style="margin:0;">
      <form id="checkout-form">
        <div id="checkout-message"></div>
        <div class="form-group">
          <label for="shipping-name">Full name</label>
          <input type="text" id="shipping-name" required />
        </div>
        <div class="form-group">
          <label for="shipping-address">Shipping address</label>
          <textarea id="shipping-address" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn">Place Order</button>
      </form>
    </div>
  </main>

  <footer>CodeAlpha Full Stack Development-E-commerce Store-Yana Makan</footer>

  <script src="/js/main.js"></script>
  <script src="/js/checkout.js"></script>
</body>

</html>
