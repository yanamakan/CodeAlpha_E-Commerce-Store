<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="site-header">
  <div class="container nav-inner">
    <a class="logo" href="/index.html">CodeAlpha Store</a>
    <nav class="nav-links">
      <a href="/index.html">Shop</a>
      <a href="/cart.html">Cart<span class="cart-badge" id="cart-count"></span></a>
      <span id="nav-auth-area"></span>
    </nav>
  </div>
</header>

<main class="container">
  <div class="form-card">
    <h1>Create an account</h1>
    <form id="register-form">
      <div id="form-message"></div>
      <div class="form-group">
        <label for="name">Full name</label>
        <input type="text" id="name" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" minlength="6" required />
      </div>
      <button type="submit" class="btn">Register</button>
    </form>
    <div class="form-footer">Already have an account? <a href="/login.html">Login</a></div>
  </div>
</main>

<script src="/js/main.js"></script>
<script src="/js/register.js"></script>
</body>
</html>
