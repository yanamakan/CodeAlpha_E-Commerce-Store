<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeAlpha Store</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
  <header class="site-header">
    <div class="container nav-inner">
      <a class="logo" href="/index.html">CodeAlpha Store</a>
      <nav class="nav-links">
        <a href="/index.html">Shop</a>
        <a href="/cart.html">Cart<span class="cart-badge" id="cart-count"></span></a>
        <span id="nav-auth-area"></span>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Shop our products</h1>
    <p class="subtitle">Browse everything from electronics to home essentials.</p>

    <div class="filter-bar">
      <input type="text" id="search-input" placeholder="Search products..." />
      <select id="category-filter">
        <option value="">All Categories</option>
      </select>
    </div>

    <div class="product-grid" id="product-grid">
      <div class="empty-state">Loading products...</div>
    </div>
  </main>

  <footer>CodeAlpha Full Stack Development-E-commerce Store-Yana Makan</footer>

  <script src="/js/main.js"></script>
  <script src="/js/products.js"></script>
</body>

</html>
